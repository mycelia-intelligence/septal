[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "septal"
dynamic = ["version"]
description = "Nonlinear programming with JAX: a vmappable SQP solver, plus a CasADi/IPOPT backend"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Max Mowbray" }]
keywords = [
    "nonlinear programming",
    "optimization",
    "sqp",
    "jax",
    "casadi",
    "ipopt",
    "parametric optimization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

dependencies = [
    "casadi>=3.6",
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "jaxopt>=0.8",
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff>=0.11,<0.12",
    "mypy<1.15",
    "black>=22,<23",
]
docs = [
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
    "sphinx-autodoc-typehints>=2",
]

[project.urls]
Homepage = "https://github.com/mycelia-intelligence/septal"
Repository = "https://github.com/mycelia-intelligence/septal"
Issues = "https://github.com/mycelia-intelligence/septal/issues"
Changelog = "https://github.com/mycelia-intelligence/septal/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "septal.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
septal = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["docs", "reports", "outputs", ".pytest_cache", ".mypy_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "E741", "F401"]
"scripts/**" = ["F401"]
# jax.config.update must run before importing sqp submodules — E402 is intentional
"src/septal/jax/sqp/__init__.py" = ["E402"]
# l/u is standard QP notation for lower/upper bounds throughout this module
"src/septal/jax/sqp/qp_subproblem.py" = ["E741"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
exclude = ["tests/", "examples/", "case_studies/", "scripts/", "docs/", "reports/"]
files = ["src"]
